package:
  name: sha3
  dependencies:
    - prelude
    - effect
    - console
    - integers
    - arrays
    - maybe
    - partial
    - foldable-traversable
    - tuples
    - strings
    - enums
    - wasm-base

workspace:
  packageSet:
    registry: 77.4.0
  backend:
    cmd: node
    args:
      - /home/bismuth/git/purescript-backend-wasm/purs-wasm/index.dev.js
      - build
      - -p
      - node
      - -E
      - -e
      - Main
  extraPackages:
    wasm-base:
      git: "https://github.com/harryprayiv/purescript-wasm-base.git"
      ref: "108ad0c28985ca677ac88e5744f7a80e2d058157"
