package:
  name: sha3
  dependencies:
    - prelude
    - effect
    - console
    - integers
    - arrays
    - maybe
    - partial
    - foldable-traversable
    - tuples
    - strings
    - enums
    - wasm-base

workspace:
  packageSet:
    registry: 77.4.0
  backend:
      cmd: purs-wasm
      args: ["build", "-p", "node", "-E", "-e", "Main"]
  extraPackages:
    wasm-base:
      git: "https://github.com/purs-wasm/purescript-wasm-base.git"
      ref: "v0.1.1"